name: atomic_ui_kit
description: >-
  A small kit of domain-free Flutter widgets: neumorphic buttons and
  containers, gradient text, a dropdown menu icon, percent and time range
  switches, and badges.
version: 0.1.3
repository: https://github.com/M1chlCZ/atomic_ui_kit
issue_tracker: https://github.com/M1chlCZ/atomic_ui_kit/issues
topics:
  - widget
  - ui
  - neumorphic
  - components
screenshots:
  - description: >-
      Widget gallery with NeuTheme: buttons, containers, gradient text,
      switches, badges, and indicators.
    path: screenshots/components.png
environment:
  sdk: ^3.11.0
dependencies:
  decimal: ^3.2.6
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
